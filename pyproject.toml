[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fidelis"
version = "0.2.0"
description = "Local Fiji/ImageJ workflow companion for Reinvent the Wheel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "Pillow==12.0.0"]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
markers = ["integration: invokes real external Fiji or speech runtime"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

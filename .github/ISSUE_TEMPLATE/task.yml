name: Task, finding or proposal
description: A scoped piece of work, an experiment, or a finding about Fidelis
labels: []
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - architecture
        - experiment
        - ui-ux
        - integration
        - verification
        - prototype
        - documentation
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to happen, or what was found. Link FR/NFR/DEC/ADR IDs where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence / acceptance
      description: For findings, the evidence (source line, probe, test output). For tasks, the testable acceptance criteria.

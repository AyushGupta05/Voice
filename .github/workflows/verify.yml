name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The Fidelis workstation suite (python3 -I fidelis-app/tools/test.py) and the Fiji bridge contract tests
# (./script/test-fiji-bridge.sh) need the pinned Fiji installation and run locally only.
jobs:
  gateway:
    # Standard runners are free for public repos. Never consume billed private-repo minutes.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: python3 script/test-verify-qupath.py -v
      - run: python3 script/test-build-bridge.py -v
      - run: python3 script/test-qupath-launch.py -v

  native-pcm:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift --version
      - run: ./script/test-audio.sh
      - run: python3 script/test-companion-process.py -v

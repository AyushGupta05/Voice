name: prototype-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prototype:
    # Unit and failure-path tests only; real Fiji/speech integration tests need the pinned local runtime.
    # Standard runners are free for public repos. Never consume billed private-repo minutes.
    if: github.event.repository.private == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip when the prototype is not present on this ref
        id: present
        shell: bash
        run: |
          if [ -f backend/src/fidelis/main.py ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.present.outputs.run == 'true'
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        if: steps.present.outputs.run == 'true'
        with:
          node-version: "24"
      - name: Install
        if: steps.present.outputs.run == 'true'
        shell: bash
        run: |
          python -m pip install -r requirements-dev.lock.txt
          python -m pip install --no-deps -e ".[dev]"
          npm --prefix frontend ci
      - name: Lint
        if: steps.present.outputs.run == 'true'
        run: python -m ruff check .
      - name: Unit tests (no integration)
        if: steps.present.outputs.run == 'true'
        run: python -m pytest -m "not integration"
      - name: Frontend build
        if: steps.present.outputs.run == 'true'
        run: npm --prefix frontend run build
